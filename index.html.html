<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정의관 적용 프로젝트 - 진로별 사회적 갈등 상황</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f7f8fc;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #5b6cf9, #8c6ff7);
      color: white;
      padding: 38px 20px 30px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }
    header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
      line-height: 1.6;
    }
    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 50px;
    }
    .guide {
      background: #fff;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      margin-bottom: 20px;
      line-height: 1.65;
    }
    .guide strong { color: #5967e8; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    #search {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #d9dce8;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
    }
    #search:focus {
      border-color: #6c78ee;
      box-shadow: 0 0 0 3px rgba(108,120,238,.12);
    }
    .count {
      min-width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e4ec;
      font-weight: 700;
      color: #5d66c9;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 20px;
      align-items: start;
    }

    .jobs {
      background: white;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      max-height: 680px;
      overflow-y: auto;
    }

    .job-btn {
      width: 100%;
      border: none;
      background: #f3f5fb;
      margin-bottom: 9px;
      padding: 13px 14px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: .15s ease;
    }
    .job-btn:hover {
      background: #e9edff;
      transform: translateY(-1px);
    }
    .job-btn.active {
      background: #6472ee;
      color: white;
      font-weight: 700;
    }

    .detail {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      min-height: 430px;
      position: sticky;
      top: 16px;
    }

    .detail h2 {
      margin: 0 0 20px;
      color: #4d59d5;
      font-size: 27px;
    }

    .card {
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      line-height: 1.65;
    }
    .situation { background: #fff6e7; }
    .liberal { background: #edf7ff; }
    .community { background: #f1f8ef; }
    .issue { background: #f6f0ff; }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .placeholder {
      color: #777;
      line-height: 1.8;
      padding-top: 35px;
      text-align: center;
    }

    .footer-note {
      margin-top: 18px;
      padding: 15px 16px;
      background: #f8f9fd;
      border-radius: 14px;
      color: #555;
      line-height: 1.6;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      header h1 { font-size: 24px; }
      .layout { grid-template-columns: 1fr; }
      .jobs { max-height: 360px; }
      .detail { position: static; min-height: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>정의관 적용 프로젝트</h1>
  <p>나의 진로와 관련된 사회적 갈등 상황을 찾아<br>자유주의와 공동체주의 관점에서 분석해 봅시다.</p>
</header>

<main class="container">
  <section class="guide">
    <strong>사용 방법</strong><br>
    아래에서 관심 있는 직업을 선택하세요. 해당 직업에서 나타날 수 있는 사회적 갈등 상황과
    자유주의·공동체주의의 관점 예시가 나타납니다. 예시는 그대로 옮기기보다 자신의 생각을 덧붙여 작성하세요.
  </section>

  <div class="search-box">
    <input id="search" type="text" placeholder="직업을 검색해 보세요. 예: 간호사, 교사, 개발자" />
    <div class="count" id="count"></div>
  </div>

  <div class="layout">
    <section class="jobs" id="jobs"></section>

    <section class="detail" id="detail">
      <div class="placeholder">
        👈 왼쪽에서 직업을 선택해 주세요.<br><br>
        <b>핵심 질문</b><br>
        “개인의 자유·권리·선택”과<br>
        “공동체의 가치·책임·공익”이 어디에서 충돌할까요?
      </div>
    </section>
  </div>
</main>

<script>
const data = [
  ["의사","치료를 거부하는 환자의 선택을 존중할 것인가, 생명 보호를 위해 치료를 우선할 것인가?","환자는 자신의 신체와 치료에 대해 스스로 결정할 권리가 있으므로 치료 거부 의사를 최대한 존중해야 한다고 볼 수 있다.","개인은 공동체의 구성원이므로 생명 보호와 가족·의료진에게 미치는 영향을 함께 고려해야 한다고 볼 수 있다.","자기결정권 ↔ 생명 보호"],
  ["간호사","감염병 환자의 개인정보를 보호할 것인가, 주변 사람들의 안전을 위해 정보를 공유할 것인가?","개인의 사생활과 개인정보에 대한 권리를 우선하여 감염 사실을 함부로 공개해서는 안 된다고 볼 수 있다.","감염 확산을 막고 공동체 구성원의 건강을 지키기 위해 필요한 범위에서는 정보를 공유할 수 있다고 볼 수 있다.","사생활 보호 ↔ 공동체 안전"],
  ["응급구조사","응급환자가 여러 명인데 의료 자원이 부족할 경우 누구를 먼저 치료할 것인가?","각 개인의 생명과 권리를 동등하게 존중하며 개인별 상황을 최대한 고려해야 한다고 볼 수 있다.","전체 피해를 줄이고 공동체 전체의 생명을 최대한 많이 보호할 수 있는 방식으로 우선순위를 정해야 한다고 볼 수 있다.","개인의 생명권 ↔ 전체 피해 최소화"],
  ["물리치료사","치료 효과가 낮더라도 환자가 원하는 치료를 계속할 것인가, 제한된 의료 자원을 고려할 것인가?","환자는 자신의 치료 방법을 선택할 권리가 있으므로 개인의 의사를 폭넓게 존중해야 한다고 볼 수 있다.","의료 자원은 공동체가 함께 사용하는 자원이므로 효과와 필요성을 고려해 공정하게 배분해야 한다고 볼 수 있다.","환자 선택 ↔ 의료자원의 공정한 이용"],
  ["약사","개인이 원하는 의약품 구매를 폭넓게 허용할 것인가, 오남용 방지를 위해 제한할 것인가?","성인은 자신의 건강과 소비에 대해 스스로 결정할 자유가 있으므로 선택을 최대한 보장해야 한다고 볼 수 있다.","의약품 오남용은 개인뿐 아니라 사회 전체에 피해를 줄 수 있으므로 일정한 제한이 필요하다고 볼 수 있다.","개인 선택 ↔ 국민 건강"],
  ["치과의사","환자가 건강상 필요보다 미용 목적의 시술을 강하게 요구할 경우 어디까지 받아들일 것인가?","개인은 자신의 외모와 신체에 대해 스스로 선택할 권리가 있으므로 원하는 시술을 선택할 수 있다고 볼 수 있다.","전문가는 개인의 요구뿐 아니라 건강과 사회적 책임을 고려하여 위험한 시술은 제한해야 한다고 볼 수 있다.","개인 선택 ↔ 전문가의 책임"],
  ["수의사","반려동물에 대한 보호자의 결정권을 어디까지 인정할 것인가?","보호자는 반려동물의 양육과 치료에 대해 폭넓은 선택권을 가질 수 있다고 볼 수 있다.","동물도 보호받아야 할 생명이며 사회 전체가 동물복지를 지켜야 하므로 보호자의 선택을 제한할 수 있다고 볼 수 있다.","소유자의 선택 ↔ 동물복지"],
  ["임상병리사","유전검사 결과와 같은 민감한 의료정보를 개인에게만 맡길 것인가, 가족의 건강을 위해 공유할 수 있는가?","개인의 의료정보는 사적인 정보이므로 본인의 동의 없이 공유해서는 안 된다고 볼 수 있다.","가족 구성원의 건강과 생명에 중대한 영향을 줄 수 있다면 공동체적 책임 차원에서 공유 필요성을 고려할 수 있다.","개인정보 ↔ 가족·공동체 보호"],
  ["방사선사","환자가 검사를 강하게 원할 때 개인 선택을 존중할 것인가, 불필요한 검사를 제한할 것인가?","환자는 자신의 건강에 대해 필요한 검사를 선택할 자유가 있다고 볼 수 있다.","불필요한 검사는 건강 위험과 의료 자원 낭비를 가져올 수 있으므로 전문가가 제한할 수 있다고 볼 수 있다.","선택권 ↔ 안전·의료자원"],
  ["교사","학생의 개성과 자유를 최대한 허용할 것인가, 학급 전체의 질서와 규칙을 우선할 것인가?","학생 개개인의 개성과 선택을 존중하고 불필요한 규칙은 최소화해야 한다고 볼 수 있다.","학교와 학급은 함께 생활하는 공동체이므로 모두의 학습권을 위해 일정한 규칙과 책임이 필요하다고 볼 수 있다.","개인 자유 ↔ 공동체 질서"],
  ["유치원 교사","보호자의 교육방식을 최대한 존중할 것인가, 공동생활을 위해 공통 규칙을 적용할 것인가?","가정마다 가치관과 교육 방식이 다르므로 부모와 아동의 선택을 존중해야 한다고 볼 수 있다.","유치원은 여러 사람이 함께 지내는 공동체이므로 공통된 생활 규칙을 따라야 한다고 볼 수 있다.","가정의 선택 ↔ 공동체 규칙"],
  ["특수교사","한 학생에게 더 많은 교육 자원을 제공하는 것이 공정한가?","모든 학생은 동등한 권리를 가지므로 특정 학생에게 과도하게 자원이 집중되는 것은 신중해야 한다고 볼 수 있다.","공동체는 구성원의 필요와 상황에 따라 더 많은 지원이 필요한 사람을 도와야 한다고 볼 수 있다.","개인의 평등한 권리 ↔ 필요에 따른 지원"],
  ["상담교사","학생의 상담 내용을 비밀로 지킬 것인가, 다른 사람의 안전과 관련되면 알릴 것인가?","학생의 사생활과 신뢰 관계를 지키기 위해 상담 내용의 비밀을 최대한 보장해야 한다고 볼 수 있다.","다른 학생이나 공동체의 안전에 중대한 영향을 줄 수 있다면 필요한 범위에서 정보를 공유해야 한다고 볼 수 있다.","사생활 ↔ 공동체 안전"],
  ["경찰관","범죄 예방을 위해 CCTV와 얼굴인식 기술을 확대해도 되는가?","시민의 사생활과 자유를 침해할 수 있으므로 국가의 감시 권한을 최소화해야 한다고 볼 수 있다.","범죄를 예방하고 시민 전체의 안전을 확보하기 위해 일정한 범위의 감시 기술을 사용할 수 있다고 볼 수 있다.","사생활·자유 ↔ 치안"],
  ["소방관","위험지역에서 구조를 원하는 개인의 요구를 어디까지 받아들여야 하는가?","위험에 처한 개인의 생명과 구조 요청을 최대한 존중해야 한다고 볼 수 있다.","구조대원과 다른 시민들의 안전까지 고려해 지나치게 위험한 구조 활동은 제한할 수 있다고 볼 수 있다.","개인의 생명 ↔ 구조대원의 안전"],
  ["군인","개인의 신념이나 선택과 국가 안보를 위한 의무가 충돌하면 무엇을 우선해야 하는가?","개인의 양심과 신념의 자유를 국가가 최대한 보장해야 한다고 볼 수 있다.","국가 공동체의 안전을 유지하기 위해 구성원에게 일정한 의무와 책임을 요구할 수 있다고 볼 수 있다.","개인의 자유 ↔ 국가 공동체"],
  ["판사","개인의 사정을 고려해 처벌을 달리할 것인가, 동일한 기준을 엄격하게 적용할 것인가?","각 개인의 상황과 권리를 충분히 고려하여 획일적인 판단을 피해야 한다고 볼 수 있다.","공동체의 법질서와 신뢰를 위해 누구에게나 일관된 기준을 적용해야 한다고 볼 수 있다.","개인 상황 ↔ 법질서"],
  ["검사","범죄자의 권리를 최대한 보장할 것인가, 사회 안전을 위해 강한 처벌을 요구할 것인가?","범죄 혐의를 받는 사람도 기본권과 절차적 권리를 충분히 보장받아야 한다고 볼 수 있다.","공동체의 안전과 질서를 지키기 위해 필요한 경우 엄정한 처벌을 요구할 수 있다고 볼 수 있다.","개인 권리 ↔ 사회 안전"],
  ["변호사","사회적으로 비난받는 사람도 적극적으로 변호해야 하는가?","누구나 법 앞에서 자신의 권리를 보호받고 변호 받을 권리가 있다고 볼 수 있다.","개인의 권리 보장과 함께 공동체의 정의와 사회적 책임도 고려해야 한다고 볼 수 있다.","개인의 권리 ↔ 공동체 가치"],
  ["교도관","수용자의 자유와 권리를 어느 정도까지 제한할 수 있는가?","수용자도 인간으로서 기본적인 권리와 존엄성을 보장받아야 한다고 볼 수 있다.","교정시설의 질서와 다른 사람의 안전을 위해 필요한 범위에서는 자유를 제한할 수 있다고 볼 수 있다.","개인의 권리 ↔ 교정·안전"],
  ["공무원","개인의 편의를 위해 규제를 줄일 것인가, 공익을 위해 규제를 유지할 것인가?","국가는 개인의 자유로운 활동을 최대한 보장하고 불필요한 규제를 최소화해야 한다고 볼 수 있다.","공동체의 안전과 공익을 위해 필요한 규제는 유지해야 한다고 볼 수 있다.","개인 자유 ↔ 공익"],
  ["사회복지사","복지 지원에서 개인의 선택을 존중할 것인가, 사회가 정한 조건을 적용할 것인가?","복지 대상자가 자신의 삶과 지원 방식을 스스로 선택할 수 있어야 한다고 볼 수 있다.","공동체의 한정된 자원을 공정하고 책임 있게 사용하기 위해 일정한 기준과 조건이 필요하다고 볼 수 있다.","개인 선택 ↔ 공동체 책임"],

  ["작가","창작의 자유를 최대한 보장할 것인가, 사회적 차별이나 혐오를 조장할 수 있는 표현을 제한할 것인가?","창작과 표현의 자유를 최대한 보장해야 한다고 볼 수 있다.","표현이 공동체 구성원에게 심각한 피해를 준다면 사회적 책임을 고려해야 한다고 볼 수 있다.","표현의 자유 ↔ 공동체 가치"],

  ["아이돌·가수","연예인의 개인적 행동을 소속사나 팬덤이 어디까지 제한할 수 있는가?","연예인도 개인으로서 사생활과 선택의 자유를 충분히 보장받아야 한다고 볼 수 있다.","공적인 활동을 하는 사람으로서 팬과 사회에 미치는 영향에 대한 책임을 고려해야 한다고 볼 수 있다.","개인 자유 ↔ 직업적·사회적 책임"],
  ["광고기획자","소비자의 구매 욕구를 자극하는 광고를 자유롭게 제작할 것인가, 사회적 영향을 고려할 것인가?","기업과 제작자는 법의 범위에서 자유롭게 광고하고 소비자는 스스로 판단할 수 있다고 볼 수 있다.","허위·과장 또는 사회적 편견을 강화하는 광고는 소비자와 공동체 보호를 위해 제한할 수 있다고 볼 수 있다.","기업·표현의 자유 ↔ 소비자 보호"],
  ["디자이너","소비자가 원하는 디자인과 장애인·노인 등 모두의 접근성을 고려한 디자인 중 무엇을 우선할 것인가?","의뢰인과 사용자의 개별 취향과 선택을 최대한 반영해야 한다고 볼 수 있다.","디자인은 사회 구성원 모두가 이용할 수 있도록 포용성과 접근성을 고려해야 한다고 볼 수 있다.","개인 취향 ↔ 포용성"],
  ["패션디자이너","유행과 소비자의 선택을 위해 빠르게 제품을 생산할 것인가, 환경과 노동 문제를 고려할 것인가?","소비자와 기업은 원하는 상품을 자유롭게 선택하고 생산할 수 있어야 한다고 볼 수 있다.","생산 과정이 환경과 노동자에게 미치는 영향을 고려하여 사회적 책임을 져야 한다고 볼 수 있다.","소비·기업 자유 ↔ 환경·사회적 책임"],

  ["영양사","학생에게 음식 선택권을 넓게 줄 것인가, 건강을 위해 급식 메뉴를 제한할 것인가?","학생 개인의 취향과 선택권을 최대한 존중해야 한다고 볼 수 있다.","학교 급식은 학생 전체의 건강을 책임지는 제도이므로 영양 기준을 적용할 수 있다고 볼 수 있다.","개인 선택 ↔ 건강"],
  ["운동선수","선수 개인의 수익 활동과 국가대표로서의 책임이 충돌하면 무엇을 우선할 것인가?","선수도 개인이므로 자신의 직업과 수익 활동을 자유롭게 선택할 권리가 있다고 볼 수 있다.","대표 선수는 공동체를 대표하는 역할과 책임을 함께 고려해야 한다고 볼 수 있다.","개인 이익 ↔ 공동체 책임"],
  ["스포츠 지도자","선수 개인의 선택을 존중할 것인가, 팀 전체의 성과를 위해 개인에게 희생을 요구할 수 있는가?","선수의 진로와 출전 여부 등 개인의 선택을 존중해야 한다고 볼 수 있다.","팀은 공동 목표를 가진 공동체이므로 구성원에게 일정한 협력과 책임을 요구할 수 있다고 볼 수 있다.","개인 자유 ↔ 팀 공동체"],
  ["경영인·CEO","기업이 이윤을 최대화할 것인가, 비용이 들더라도 노동자·환경·지역사회에 책임을 져야 하는가?","기업은 법의 범위에서 자유롭게 경영하고 이윤을 추구할 권리가 있다고 볼 수 있다.","기업도 공동체의 구성원이므로 노동자·환경·지역사회에 대한 책임을 져야 한다고 볼 수 있다.","경제적 자유 ↔ 사회적 책임"],
  ["회계사","고객 기업의 이익과 사회에 정확한 정보를 제공할 책임이 충돌하면 무엇을 우선할 것인가?","고객과의 계약과 기업의 이익을 최대한 보호해야 한다고 볼 수 있다.","회계정보는 사회 전체의 신뢰와 연결되므로 정확성과 공적 책임을 우선해야 한다고 볼 수 있다.","사적 이익 ↔ 사회적 신뢰"],
  ["세무사","합법적인 절세를 최대한 도울 것인가, 공동체 운영을 위한 조세 부담도 고려해야 하는가?","개인은 법이 허용하는 범위에서 자신의 재산을 최대한 보호하고 절세할 자유가 있다고 볼 수 있다.","세금은 공동체 운영을 위한 재원이므로 구성원은 공정한 부담의 책임을 고려해야 한다고 볼 수 있다.","재산권 ↔ 공동체 기여"],
  ["은행원","개인의 신용과 상환 능력에 따라 대출할 것인가, 취약계층의 금융 접근성을 고려할 것인가?","대출은 계약이므로 개인의 능력과 책임에 따라 조건을 정하는 것이 공정하다고 볼 수 있다.","금융 기회가 지나치게 불평등하면 공동체가 취약계층의 접근성을 보완해야 한다고 볼 수 있다.","계약·책임 ↔ 사회적 배려"],
  ["투자전문가","수익성이 높은 기업에 투자할 것인가, 수익이 낮더라도 환경·사회적 책임을 고려할 것인가?","투자자는 자신의 재산을 원하는 곳에 투자하고 수익을 추구할 자유가 있다고 볼 수 있다.","투자가 사회와 환경에 미치는 영향까지 고려하는 책임 있는 선택이 필요하다고 볼 수 있다.","개인 이익 ↔ 공동체 가치"],
  ["부동산 관련 직업","소유자가 원하는 가격에 자유롭게 거래하도록 할 것인가, 주거 안정을 위해 규제할 것인가?","재산 소유자는 자신의 재산을 자유롭게 거래하고 가격을 결정할 권리가 있다고 볼 수 있다.","주거는 공동체 구성원의 기본 생활과 관련되므로 주거 안정을 위한 일정한 규제가 필요하다고 볼 수 있다.","재산권 ↔ 주거 안정"],
  ["개발자","이용자 데이터를 활용해 편리한 서비스를 만들 것인가, 개인정보 보호를 우선할 것인가?","이용자가 동의한다면 기업과 개인이 데이터를 자유롭게 활용할 수 있다고 볼 수 있다.","개인정보 유출이나 감시 위험을 줄이기 위해 공동체 차원의 엄격한 보호 기준이 필요하다고 볼 수 있다.","편의·기업 자유 ↔ 개인정보"],
  ["AI 개발자","AI 개발과 활용을 자유롭게 허용할 것인가, 사회적 피해 가능성을 고려해 규제할 것인가?","기술 개발과 기업 활동의 자유를 최대한 보장하여 혁신을 촉진해야 한다고 볼 수 있다.","AI가 일자리·차별·안전 등에 미치는 영향을 고려하여 사회적 규칙과 책임을 마련해야 한다고 볼 수 있다.","기술 혁신 ↔ 사회 안전"],

const jobsEl = document.getElementById("jobs");
const detailEl = document.getElementById("detail");
const searchEl = document.getElementById("search");
const countEl = document.getElementById("count");

function renderJobs(list) {
  jobsEl.innerHTML = "";
  countEl.textContent = `${list.length}개`;
  if (!list.length) {
    jobsEl.innerHTML = '<div style="padding:20px;text-align:center;color:#777;">검색 결과가 없습니다.</div>';
    return;
  }
  list.forEach((item) => {
    const btn = document.createElement("button");
    btn.className = "job-btn";
    btn.textContent = item[0];
    btn.onclick = () => {
      document.querySelectorAll(".job-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      showDetail(item);
    };
    jobsEl.appendChild(btn);
  });
}

function showDetail(item) {
  detailEl.innerHTML = `
    <h2>${item[0]}</h2>
    <div class="card situation">
      <h3>📌 사회적 갈등 상황</h3>
      <div>${item[1]}</div>
    </div>
    <div class="card liberal">
      <h3>🟦 자유주의 관점 예시</h3>
      <div>${item[2]}</div>
    </div>
    <div class="card community">
      <h3>🟩 공동체주의 관점 예시</h3>
      <div>${item[3]}</div>
    </div>
    <div class="card issue">
      <h3>⚖️ 핵심 쟁점</h3>
      <div><b>${item[4]}</b></div>
    </div>
    <div class="footer-note">
      💡 <b>수행평가 작성 팁</b><br>
      위 내용은 아이디어를 얻기 위한 예시입니다. 실제 과제에서는 자신이 선택한 입장에서
      왜 그렇게 판단했는지 근거를 덧붙여 작성해 보세요.
    </div>
  `;
}

searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = data.filter(item => item[0].toLowerCase().includes(q));
  renderJobs(filtered);
});

renderJobs(data);
</script>
